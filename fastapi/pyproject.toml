[project]
name = "uu-smart-classroom-vision"
version = "0.1.0"
description = "智慧课堂独立视觉服务"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "rtmlib==0.0.15",
    "onnxruntime>=1.23,<2",
    "opencv-python>=4.11,<5",
    "numpy>=2.2,<3",
    "opencv-contrib-python==4.14.0.94",
]

[project.urls]
Repository = "https://github.com/liusw144/uu_smart_classroom_cv"
Issues = "https://github.com/liusw144/uu_smart_classroom_cv/issues"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "jsonschema>=4.25,<5",
    "httpx2>=2.16.0",
    "openapi-spec-validator>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classroom_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
