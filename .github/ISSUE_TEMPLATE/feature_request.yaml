name: 功能建议
description: 说明业务问题、范围与验收条件
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 说明使用者、场景和现有限制
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与验收条件
      description: 涉及权限、素材、统计或部署模式时一并说明
    validations:
      required: true
