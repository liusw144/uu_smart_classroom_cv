name: 工程验证
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python scripts/quality_gate.py
      - run: python -m unittest discover -s tests -v
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-isolated-root-password
          MYSQL_DATABASE: classroom_test
          MYSQL_USER: classroom
          MYSQL_PASSWORD: ci-isolated-account-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --host=127.0.0.1 --silent" --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/classroom_test?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: classroom
      DB_PASSWORD: ci-isolated-account-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21'}
      - run: mvn -s .mvn/settings.xml -B -Pintegration verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22.18.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run verify
  fastapi:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: fastapi}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python -m pip install uv==0.12.18
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
