# 使用非特权端口和临时目录，配合只读根文件系统运行。
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format bounded '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout bounded;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream control_backend {
        zone control_backend 64k;
        server backend:8443 resolve;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        client_max_body_size 34m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        location /api/ {
            proxy_pass https://control_backend;
            proxy_ssl_server_name on;
            proxy_ssl_name backend;
            proxy_ssl_trusted_certificate /certs/control-ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
