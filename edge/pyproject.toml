[project]
name = "classroom-edge"
version = "0.1.0"
description = "智慧课堂独立边缘执行器"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classroom_edge"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
