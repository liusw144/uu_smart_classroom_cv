[project]
name = "classroom-ops"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography>=46,<51", "httpx>=0.28,<0.29"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classroom_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
